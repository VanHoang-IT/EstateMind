<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý bất động sản</title>
    <th:block th:replace="base :: css"></th:block>
</head>
<body>
    <div th:replace="base :: header"></div>

    <section class="container mt-4 mb-5">

        <h2 class="text-center text-primary mb-4">
            QUẢN LÝ BẤT ĐỘNG SẢN
        </h2>

        <!-- Alert -->
        <div th:if="${errMsg}" class="alert alert-danger alert-dismissible fade show">
            <span th:text="${errMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div th:if="${successMsg}" class="alert alert-success alert-dismissible fade show">
            <span th:text="${successMsg}"></span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="row g-4">

            <!-- FORM -->
            <div class="col-lg-4">

                <div class="card shadow">

                    <div class="card-header bg-primary text-white fw-bold"
                         th:text="${property.id != null ? 'Cập nhật BĐS #' + property.id : 'Thêm bất động sản'}">
                    </div>

                    <div class="card-body">

                        <form method="post"
                              enctype="multipart/form-data"
                              th:object="${property}"
                              th:action="${property.id != null ?
                              '/EstateMind/admin/properties/' + property.id :
                              '/EstateMind/admin/properties'}">

                            <input type="hidden" th:field="*{id}"/>

                            <!-- Tiêu đề -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">
                                    Tiêu đề
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{title}"
                                    placeholder="Nhập tiêu đề..."
                                    required>
                            </div>

                            <!-- Danh mục -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Danh mục
                                </label>

                                <select
                                    class="form-select"
                                    th:field="*{categoryId}">

                                    <option value="">
                                        -- Chọn danh mục --
                                    </option>

                                    <option
                                        th:each="c:${categories}"
                                        th:value="${c.id}"
                                        th:text="${c.name}">
                                    </option>

                                </select>

                            </div>

                            <!-- Giá -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Giá
                                </label>

                                <input
                                    class="form-control"
                                    type="number"
                                    th:field="*{price}">

                            </div>

                            <!-- Diện tích -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Diện tích (m²)
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{area}">

                            </div>

                            <!-- Địa chỉ -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Địa chỉ
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{address}">

                            </div>

                            <!-- Thành phố -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Thành phố
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{city}">

                            </div>

                            <!-- Quận -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Quận/Huyện
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{district}">

                            </div>

                            <!-- Phường -->
                            <div class="mb-3">

                                <label class="form-label fw-bold">
                                    Phường/Xã
                                </label>

                                <input
                                    class="form-control"
                                    th:field="*{ward}">

                            </div>

                            <div class="row">

                                <div class="col">

                                    <label class="form-label fw-bold">
                                        Phòng ngủ
                                    </label>

                                    <input
                                        class="form-control"
                                        type="number"
                                        th:field="*{bedrooms}">

                                </div>

                                <div class="col">

                                    <label class="form-label fw-bold">
                                        Phòng tắm
                                    </label>

                                    <input
                                        class="form-control"
                                        type="number"
                                        th:field="*{bathrooms}">

                                </div>

                            </div>

                            <div class="mt-3">

                                <label class="form-label fw-bold">
                                    Số tầng
                                </label>

                                <input
                                    class="form-control"
                                    type="number"
                                    th:field="*{floors}">

                            </div>

                            <div class="mt-3">

                                <label class="form-label fw-bold">
                                    Trạng thái
                                </label>

                                <select
                                    class="form-select"
                                    th:field="*{status}">

                                    <option value="AVAILABLE">
                                        Đang bán
                                    </option>

                                    <option value="RENT">
                                        Cho thuê
                                    </option>

                                    <option value="SOLD">
                                        Đã bán
                                    </option>

                                </select>

                            </div>

                            <div class="mt-3">

                                <label class="form-label fw-bold">
                                    Mô tả
                                </label>

                                <textarea
                                    rows="4"
                                    class="form-control"
                                    th:field="*{description}">
                                </textarea>

                            </div>

                            <div class="mt-3">

                                <label class="form-label fw-bold">
                                    Ảnh
                                </label>

                                <input
                                    class="form-control"
                                    type="file"
                                    th:field="*{file}"
                                    accept="image/*">

                            </div>

                            <div class="d-grid mt-4">

                                <button
                                    class="btn btn-success"
                                    type="submit"
                                    th:text="${property.id != null ?
                                    'Cập nhật' :
                                    'Thêm mới'}">

                                </button>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

            <!-- DANH SÁCH -->
            <div class="col-lg-8">

                <div class="card shadow">

                    <div class="card-header bg-dark text-white">
                        Danh sách bất động sản
                    </div>

                    <div class="card-body">

                        <!-- Tìm kiếm -->
                        <form method="get" th:action="@{/admin/properties}" class="row g-3 mb-3">

                            <div class="col-md-4">
                                <input type="text"
                                       class="form-control"
                                       name="kw"
                                       th:value="${param.kw}"
                                       placeholder="Nhập tiêu đề...">
                            </div>

                            <div class="col-md-3">
                                <select class="form-select"
                                        name="cateId">

                                    <option value="">
                                        Tất cả danh mục
                                    </option>

                                    <option
                                        th:each="c:${categories}"
                                        th:value="${c.id}"
                                        th:selected="${param.cateId == c.id.toString()}"
                                        th:text="${c.name}">
                                    </option>

                                </select>
                            </div>

                            <div class="col-md-2">
                                <button class="btn btn-primary w-100">
                                    Tìm kiếm
                                </button>
                            </div>

                        </form>

                        <table class="table table-bordered table-hover align-middle">

                            <thead class="table-light">

                                <tr>

                                    <th>ID</th>

                                    <th>Tiêu đề</th>

                                    <th>Danh mục</th>

                                    <th>Giá</th>

                                    <th>Diện tích</th>

                                    <th>Địa chỉ</th>

                                    <th>Trạng thái</th>

                                    <th width="150"></th>

                                </tr>

                            </thead>

                            <tbody>

                                <tr th:each="p : ${properties}">

                                    <td th:text="${p.id}"></td>

                                    <td th:text="${p.title}"></td>

                                    <td th:text="${p.categoryId.name}"></td>

                                    <td th:text="${#numbers.formatDecimal(p.price,0,'COMMA',0,'POINT')}"></td>

                                    <td th:text="${p.area} + ' m²'"></td>

                                    <td th:text="${p.address}"></td>

                                    <td>

                                        <span class="badge bg-success"
                                              th:if="${p.status == 'AVAILABLE'}">
                                            Đang bán
                                        </span>

                                        <span class="badge bg-warning text-dark"
                                              th:if="${p.status == 'RENT'}">
                                            Cho thuê
                                        </span>

                                        <span class="badge bg-secondary"
                                              th:if="${p.status == 'SOLD'}">
                                            Đã bán
                                        </span>

                                    </td>

                                    <td>

                                        <a class="btn btn-sm btn-primary"
                                           th:href="@{/admin/properties/{id}(id=${p.id})}">
                                            Sửa
                                        </a>

                                        <button class="btn btn-sm btn-danger"
                                                th:onclick="'deleteProperty(' + ${p.id} + ')'">
                                            Xóa
                                        </button>

                                    </td>

                                </tr>

                                <tr th:if="${#lists.isEmpty(properties)}">

                                    <td colspan="8" class="text-center text-muted">

                                        Chưa có bất động sản nào.

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>
                </div>
            </div>
        </div>
    </section>
    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
