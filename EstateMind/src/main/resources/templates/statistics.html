<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thống kê</title>
    <th:block th:replace="base :: css"></th:block>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .stat-card { border-radius: 12px; transition: transform 0.2s; }
        .stat-card:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
    <div th:replace="base :: header"></div>

    <section class="container mt-4 mb-5">
        <h2 class="text-center text-info mb-4">THỐNG KÊ HỆ THỐNG</h2>

        <div class="row g-3 mb-4">
            <div class="col-md-3">
                <div class="card stat-card bg-primary text-white p-3">
                    <div class="small opacity-75">Tổng tin đăng</div>
                    <div class="fs-2 fw-bold" th:text="${totalProperties}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-success text-white p-3">
                    <div class="small opacity-75">Đã duyệt (đang hoạt động)</div>
                    <div class="fs-2 fw-bold" th:text="${approvedCount}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-warning text-dark p-3">
                    <div class="small">Đang chờ duyệt</div>
                    <div class="fs-2 fw-bold" th:text="${pendingCount}">0</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card stat-card bg-danger text-white p-3">
                    <div class="small opacity-75">Bị từ chối</div>
                    <div class="fs-2 fw-bold" th:text="${rejectedCount}">0</div>
                </div>
            </div>
        </div>

        <div class="row g-3">
            <div class="col-md-6 offset-md-3">
                <div class="card p-4">
                    <h5 class="fw-bold mb-3 text-center">Tỉ lệ tin đăng theo trạng thái kiểm duyệt</h5>
                    <canvas id="moderationChart" height="220"></canvas>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="base :: footer"></div>

    <script th:inline="javascript">
        window.CHART_DATA = {
            moderation: /*[[${byModeration}]]*/ []
        };
    </script>
    <script th:src="@{/js/statistics.js}"></script>
</body>
</html>
