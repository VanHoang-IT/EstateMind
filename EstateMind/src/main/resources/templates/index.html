<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Quản lý bất động sản</title>
    <th:block th:replace="base :: css"></th:block>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div th:replace="base :: header"></div>
    <section class="container mt-4">

        <div class="mb-3">
            <a th:href="@{/admin/properties}" class="btn btn-primary">
                Thêm bất động sản
            </a>
        </div>
        <table class="table table-bordered table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Tiêu đề</th>
                    <th>Địa chỉ</th>
                    <th>Loại</th>
                    <th>Giá</th>
                    <th>Diện tích</th>
                    <th>Trạng thái</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="p : ${properties}">
                    <td th:text="${p.id}"></td>
                    <td th:text="${p.title}"></td>
                    <td th:text="${p.address}"></td>
                    <td th:text="${p.categoryId.name}"></td>
                    <td th:text="${p.price}"></td>
                    <td th:text="${p.area}"></td>
                    <td th:text="${p.status}"></td>
                    <td>
                        <a class="btn btn-info"
                           th:href="@{/admin/properties/{id}(id=${p.id})}">
                            Cập nhật
                        </a>
                        <button class="btn btn-danger"
                                th:onclick="'deleteProperty(\'' + @{/api/properties/} + ${p.id} + '\')'">
                            Xóa
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
    <div th:replace="base :: footer"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
